<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0620;color:#f4f1ff;font-family:'Poppins',system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;max-width:min(960px,calc(100vh * 1.7857));aspect-ratio:800/448}
canvas{width:100%;height:100%;display:block;border-radius:10px;background:#150f3d}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(10,6,32,.8);border-radius:10px;padding:1rem}
#ov h2{font-size:clamp(1.2rem,4vw,2rem);margin-bottom:.5rem;background:linear-gradient(120deg,#5ee0ff,#ff8fd0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#ov p{font-size:clamp(.68rem,1.8vw,.9rem);line-height:1.6;color:rgba(244,241,255,.75);margin-bottom:1rem}
#ov button{margin:.25rem;font:700 1rem 'Poppins',sans-serif;color:#fff;border:0;border-radius:99px;padding:.7rem 2.2rem;cursor:pointer;background:linear-gradient(120deg,#8b5cf6,#5ee0ff)}
#skip{display:none;position:absolute;top:10px;right:12px;z-index:5;font:700 .8rem 'Poppins',sans-serif;color:#fff;background:rgba(10,6,32,.6);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:.35rem .9rem;cursor:pointer}
.story #pad{display:none!important}
#pad{display:none;position:absolute;left:0;right:0;bottom:0;justify-content:space-between;padding:0 .6rem .6rem;pointer-events:none}
@media (pointer:coarse){#pad{display:flex}}
.g{display:grid;grid-template-columns:repeat(3,auto);gap:.35rem}
#pad b{pointer-events:auto;width:clamp(38px,8vw,56px);height:clamp(38px,8vw,56px);border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3)}
.online #pad{justify-content:space-between}
.g.l b{border-color:#ff6a5a}.g.r b{border-color:#d7f06a}
#pad b.on{background:rgba(255,255,255,.4)}
</style>

addEventListener('keyup',e=>{keys[e.code]=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
document.querySelectorAll('#pad b').forEach(b=>{
  const ks=b.dataset.k.split(' '),on=e=>{e.preventDefault();ks.forEach(k=>keys[k]=1);b.classList.add('on');},off=()=>{ks.forEach(k=>keys[k]=0);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,off));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
const CT=[{l:['KeyA','v1l'],r:['KeyD','v1r'],j:['KeyW','v1j'],f:['KeyF','v1f']},
          {l:['ArrowLeft','v2l'],r:['ArrowRight','v2r'],j:['ArrowUp','v2j'],f:['Enter','v2f']}];
const dn=a=>a.some(k=>keys[k]);
const ALLC={l:['KeyA','ArrowLeft','v1l','v2l'],r:['KeyD','ArrowRight','v1r','v2r'],j:['KeyW','ArrowUp','Space','v1j','v2j'],f:['KeyF','Enter','KeyX','v1f','v2f']};
const isR=p=>NET&&p.id!==NET.me;

// ── sound ──
let ac;function snd(f,d=.1,t='square'){try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain();o.type=t;o.frequency.value=f;v.gain.value=.05;v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

// ── physics ──
const sol=(x,y)=>x<0||x>=LW?1:y<0||y>=LH?0:G[y][x]==='#';
const fl=Math.floor,ov2=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function moveX(o){o.x+=o.vx;let hit=0;
  for(let y=fl(o.y/T);y<=fl((o.y+o.h-1)/T);y++){
    if(o.vx>0&&sol(fl((o.x+o.w-1)/T),y)){o.x=fl((o.x+o.w-1)/T)*T-o.w;hit=1;}
    else if(o.vx<0&&sol(fl(o.x/T),y)){o.x=(fl(o.x/T)+1)*T;hit=1;}}
  return hit;}
function moveY(o){o.y+=o.vy;o.on=0;
  for(let x=fl(o.x/T);x<=fl((o.x+o.w-1)/T);x++){
    if(o.vy>0&&sol(x,fl((o.y+o.h-1)/T))){o.y=fl((o.y+o.h-1)/T)*T-o.h;o.vy=0;o.on=1;}
    else if(o.vy<0&&sol(x,fl(o.y/T))){o.y=(fl(o.y/T)+1)*T;o.vy=0;}}}

function burst(x,y,c){for(let i=0;i<9;i++)PT.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4,l:30,c});}
function over(){state='over';ui('💀 Game over','The castle won this time.<br>Stars kept: '+sStart,[['Try again',()=>go(lvl,'retry')]]);}
function hurt(p){if(p.inv>0||p.dead||state!=='play')return;lives--;snd(150,.3,'sawtooth');burst(p.x+11,p.y+14,p.col);
  if(NET)net('life',{l:lives});if(lives<=0){over();return;}p.dead=50;}
function go(n,m,rx){if(m==='retry'){lives=5;stars=sStart;}if(m==='full'){lives=5;stars=0;}if(NET&&!rx)net('go',{n,m});ov.style.display='none';start(n);}
function lhit(e){hit(e);if(NET)net('hit',{i:E.indexOf(e)});}
function onMP(o){for(const m of MP)if(o.x+o.w>m.x&&o.x<m.x+m.w&&o.vy>=0){const b=o.y+o.h;if(b>=m.y-3&&b<=m.y+Math.max(12,o.vy+Math.abs(m.dy)+4)){o.y=m.y-o.h;o.vy=0;o.on=1;o.x+=m.dx;o.mp=1;}}}
function rem(p){const r=p.net;if(!r)return;p.x+=(r.x-p.x)*.4;p.y+=(r.y-p.y)*.4;p.vx=r.vx;p.vy=r.vy;p.on=r.on;p.face=r.f;p.dead=r.d?9:0;p.cd=r.cd;p.inv=r.i;p.fly=r.fl?9:0;if(r.on){p.gx=r.x;p.gy=r.y;}}
function respawn(p){const q=P[1-p.id],s=q.dead?p:q;p.x=s.gx;p.y=s.gy-6;p.vx=p.vy=0;p.inv=110;p.fly=0;}
function kill(e){e.dead=1;burst(e.x+e.w/2,e.y+e.h/2,{c:'#a9b24b',t:'#d64545',l:'#c4121c',r:'#4cc3ff',d:'#ff7a1a'}[e.t]);snd(660,.1);}
function hit(e){if(--e.hp<=0)kill(e);else{e.fl=8;snd(400,.06);}}

function upd(p,c){
  if(p.dead){if(--p.dead===0)respawn(p);return;}
  const l=dn(c.l),r=dn(c.r),j=dn(c.j),f=dn(c.f);
  p.vx=(r-l)*3.3;if(r-l)p.face=r-l;
  if(j&&!p.j0&&p.on){p.vy=-11;snd(520,.12);}
  if(!j&&p.vy<-4&&!p.fly)p.vy=-4;
  p.j0=j;
  if(f&&!p.f0&&p.cd<=0){B.push({x:p.x+11,y:p.y+16,vx:p.face*8,l:60,c:p.col});if(NET)net('bolt',{x:p.x+11,y:p.y+16,vx:p.face*8,c:p.col});p.cd=22;snd(880,.08,'sawtooth');}
  p.f0=f;p.cd--;
  if(p.fly>0){p.fly--;p.vy=Math.min(p.vy+.18,2.2);if(j&&p.vy>-3)p.vy-=.45;if(tick%4===0)PT.push({x:p.x+11,y:p.y+20,vx:(Math.random()-.5)*1.5,vy:.6,l:26,c:'#ffd6f5'});}
  else p.vy=Math.min(p.vy+.55,12);
  moveX(p);moveY(p);p.mp=0;onMP(p);
  FL.forEach(q=>{if(q.sq>0)q.sq--;if(p.vy>=0&&ov2(p,{x:q.x+2,y:q.y+10,w:28,h:22})){p.vy=-8.5;p.fly=150;q.sq=14;snd(700,.2,'triangle');}});
  if(p.on&&!p.mp){p.gx=p.x;p.gy=p.y;}
  if(p.inv>0)p.inv--;
  p.x=Math.max(cam,Math.min(cam+W-p.w,p.x));
  if(p.y>LH*T+40){hurt(p);return;}
  const t=G[fl((p.y+p.h-4)/T)];if(t&&t[fl((p.x+11)/T)]==='^')hurt(p);
}

function step(){
  tick++;
  const al=P.filter(p=>!p.dead),mx=al.length?al.reduce((a,p)=>a+p.x,0)/al.length:cam+W/2;
  cam+=(Math.max(0,Math.min(LW*T-W,mx-W/2))-cam)*.12;
  for(const m of MP){const px=m.x,py=m.y;m.ph+=.02;const o=Math.sin(m.ph)*m.amp;if(m.v)m.y=m.y0+o;else m.x=m.x0+o;m.dx=m.x-px;m.dy=m.y-py;}
  P.forEach((p,i)=>{if(!NET)upd(p,CT[i]);else if(i===NET.me)upd(p,ALLC);else rem(p);});
  if(NET&&NET.live&&tick%3===0){const p=P[NET.me];net('s',{x:Math.round(p.x),y:Math.round(p.y),vx:p.vx,vy:Math.round(p.vy*10)/10,on:p.on,f:p.face,d:p.dead?1:0,cd:p.cd,i:p.inv,fl:p.fly>0?1:0});}
  for(const e of E){if(e.dead)continue;
    if(e.fl>0)e.fl--;
    if(e.t==='c'||e.t==='t'){e.vy=Math.min(e.vy+.5,10);const w=moveX(e),ax=fl((e.x+(e.vx>0?e.w+2:-2))/T),ay=fl((e.y+e.h+2)/T);
      if(w||(e.on&&!sol(ax,ay)))e.vx*=-1;moveY(e);e.f=e.vx>0?1:-1;if(e.y>600)e.dead=1;}
    else{const d=e.t==='d',r=e.t==='r';e.ph+=d?.02:.035;e.x=e.x0+Math.sin(e.ph)*(d?120:r?40:90);e.y=e.y0+Math.sin(e.ph*(r?2.5:2))*(d?15:r?40:18);e.f=Math.cos(e.ph)>0?1:-1;
      if(d&&--e.cd<=0){const q=al.reduce((a,p)=>!a||Math.abs(p.x-e.x)<Math.abs(a.x-e.x)?p:a,null);
        if(q&&Math.abs(q.x-e.x)<420){const dx=q.x-e.x,dy=q.y-e.y,n=Math.hypot(dx,dy)||1;EB.push({x:e.x+28,y:e.y+20,vx:dx/n*3.2,vy:dy/n*3.2,l:160});snd(300,.2,'sawtooth');}e.cd=140;}}}
  for(const p of P){if(p.dead||isR(p))continue;
    for(const e of E){if(e.dead||!ov2(p,e))continue;
      if(p.vy>1&&p.y+p.h-e.y<18&&!e.sp){lhit(e);p.vy=-8;}else hurt(p);}
    S.forEach((s,i)=>{if(!s.g&&Math.hypot(s.x-(p.x+11),s.y-(p.y+14))<24){s.g=1;stars++;if(NET)net('star',{i});snd(990,.08,'triangle');if(stars%15===0){lives++;snd(1200,.25,'triangle');}}});}
  for(const b of B){b.x+=b.vx;b.l--;if(sol(fl(b.x/T),fl(b.y/T)))b.l=0;
    for(const e of E)if(!b.r&&!e.dead&&ov2({x:b.x-5,y:b.y-5,w:10,h:10},e)){lhit(e);b.l=0;}}
  for(const b of EB){b.x+=b.vx;b.y+=b.vy;b.l--;if(sol(fl(b.x/T),fl(b.y/T)))b.l=0;
    for(const p of P)if(!p.dead&&!isR(p)&&ov2({x:b.x-6,y:b.y-6,w:12,h:12},p)){hurt(p);b.l=0;}}
  EB=EB.filter(b=>b.l>0);B=B.filter(b=>b.l>0);
  for(const q of PT){q.x+=q.vx;q.y+=q.vy;q.vy+=.25;q.l--;}PT=PT.filter(q=>q.l>0);
  if(state==='play'&&P.every(p=>!p.dead&&ov2(p,door))){state='clear';snd(784,.4,'triangle');
    if(lvl<LV.length-1){const nx=()=>{const n=lvl+1;ov.style.display='none';story('mid'+lvl,()=>start(n));};
      ui('✨ Level '+(lvl+1)+' clear!','Stars so far: '+stars,[['Continue story',nx]]);if(NET)setTimeout(()=>{if(state==='clear')nx();},2500);}
    else{svSet({lvl:0,stars:0,seen:1,done:1});try{PB&&PB.award('builtin-castle');}catch(e){}ov.style.display='none';
      story('outro',()=>ui('🎉 Castle saved!','Lumi is home, thanks to you two!<br>Total stars: '+stars,[['Play again',()=>go(0,'full')]].concat(NET?[['Leave room',()=>{netClose();menu();}]]:[])));}}
}

// ── drawing ──
function star(cx,cy,r){g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;g.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q);}g.closePath();g.fill();}
// ── chibi hero sprites (P1 red-caped duelist, P2 white-haired lady) ──
const OL='rgba(25,12,45,.85)';
function box(c,x,y,w,h){g.fillStyle=c;g.fillRect(x,y,w,h);g.strokeStyle=OL;g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1);}
function blob(c,x,y,rx,ry){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();g.strokeStyle=OL;g.lineWidth=1.2;g.stroke();}
function poly(c,pts){g.fillStyle=c;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();g.strokeStyle=OL;g.lineWidth=1;g.stroke();}
function hero(p){
  const mv=Math.abs(p.vx)>.1,w=p.on&&mv,s=w?Math.sin(tick*.45)*4:0,air=!p.on,cast=p.cd>12,
    fx=Math.sin(tick*.2)*2+(mv?-3:0)+(air?-2:0),bob=w?-Math.abs(Math.sin(tick*.45))*1.5:Math.sin(tick*.1)*.6;
  g.save();g.translate(p.x+11,p.y+28+bob);g.scale(p.face,1);
  if(p.fly>0){const w2=Math.sin(tick*.6)*7;g.globalAlpha=.85;poly('#fff',[[-3,-20],[-19,-31+w2],[-13,-13]]);poly('#e9f6ff',[[-3,-18],[-22,-20+w2],[-12,-10]]);g.globalAlpha=1;}
  const legs=(pc,bc)=>{for(const[xs,dy]of[[-5+s,0],[1-s,air?-3:0]]){box(pc,xs,-10+dy,5,7);box(bc,xs-1,-4+dy,7,4);}};
  const arms=(sc,hc,wr)=>{
    box(sc,-9,-20,4,9);blob(hc,-7,-10,2.3,2.3);                                   // back arm
    if(cast){box(sc,5,-19,9,4);blob(hc,15,-17,2.3,2.3);if(wr)box(wr,10,-20,3,6);blob('#fff',18,-17,2.6,2.6);} // casting arm + spark
    else{box(sc,5,-20,4,9);blob(hc,7,-10,2.3,2.3);if(wr)box(wr,5,-12,4,2);}};
  if(p.id===0){                                                                 // red-caped duelist
    poly('#e9e1d6',[[-4,-21],[-12+fx,-14],[-13+fx*1.5,-1],[-3,-3]]);
    poly('#ff4f8b',[[-4,-21],[-8+fx*.6,-15],[-9+fx,-2],[-3,-3]]);
    poly('#ff4f8b',[[-6,-22],[-10,-34],[-1,-26]]);poly('#ff4f8b',[[6,-22],[10,-33],[1,-26]]);
    legs('#ee3b30','#e9e6e0');
    box('#8ff3f0',-7,-21,14,12);box('#ffc628',-7,-11,14,2);box('#d8d8d8',-1,-20,1,9);
    arms('#d9c58c','#ce967c');
    blob('#ce967c',0,-28,8.5,8);
    g.fillStyle='#7fa3c4';g.beginPath();g.ellipse(0,-27,8,7,0,.15,Math.PI-.15);g.fill();     // face mask
    blob('#fff',4,-30,3,3);g.fillStyle='#222';g.fillRect(-4,-31,2,3);                  // eyepatch + eye
    box('#ff3b3b',-8,-35,16,3);poly('#ff3b3b',[[-7,-35],[-10,-42],[-3,-35]]);poly('#ff3b3b',[[7,-35],[10,-42],[3,-35]]); // headband + horns
  }else{                                                                        // white-haired lady
    poly('#f4f4f8',[[-5,-36],[-13+fx,-27],[-14+fx*1.3,-8],[-4,-11],[-3,-26]]);
    legs('#db9065','#cfc9bf');
    poly('#9fd8ee',[[-6,-14],[6,-14],[9,-5],[-9,-5]]);
    box('#d7f06a',-6,-22,12,9);g.strokeStyle='#a8cf2f';g.beginPath();g.moveTo(-6,-17);g.lineTo(0,-22);g.moveTo(-6,-13);g.lineTo(6,-21);g.moveTo(0,-13);g.lineTo(6,-17);g.stroke();
    arms('#a8a6a0','#db9065','#8b5cf6');
    blob('#ffd34d',0,-21,1.7,1.7);
    blob('#db9065',0,-28,8.5,8);
    g.fillStyle='#784421';g.fillRect(3,-30,2.5,4);g.fillStyle='#222';g.fillRect(-4,-30,2,3);
    poly('#f4f4f8',[[-9,-27],[-8,-37],[8,-37],[9,-27],[5,-31],[0,-29],[-4,-31]]);       // bangs
  }
  g.restore();
}
// ── 3 backgrounds per level: one per third of the level, cross-faded, with slow parallax ──
const BG=LV.map(l=>l.bg.map(u=>{const i=new Image();i.src=u;return i;}));
function drawBG(){
  const set=BG[lvl],pr=Math.min(1,Math.max(0,cam/Math.max(1,LW*T-W))),t=pr*3,i=Math.min(2,fl(t));
  if(!set[i].naturalWidth)return 0;
  g.imageSmoothingEnabled=false;
  const dr=(im,a)=>{if(!im.naturalWidth)return;const k=Math.max(W/im.naturalWidth,H/im.naturalHeight)*1.08,w=im.naturalWidth*k,h=im.naturalHeight*k;
    g.globalAlpha=a;g.drawImage(im,-(w-W)*pr,H-h,w,h);g.globalAlpha=1;};
  dr(set[i],1);const f=t-i;if(i<2&&f>.7)dr(set[i+1],(f-.7)/.3);
  g.fillStyle='rgba(10,6,32,.22)';g.fillRect(0,0,W,H);return 1;
}
// ── enemies: cactus brute (c), spiky turtle (t), ladybug (l), jetpack bunny (r), fire dragon (d) ──
function foe(e){
  const t=e.t,wf=Math.sin(tick*.3)*2,fw=Math.sin(tick*.35)*5;
  g.save();g.translate(e.x+e.w/2,e.y+e.h);g.scale(e.f,1);if(e.fl>0)g.globalAlpha=.55;
  if(t==='c'){
    blob('#8e9a3a',-5+wf,-2,5,3);blob('#8e9a3a',5-wf,-2,5,3);blob('#a9b24b',-12,-20,4,3);blob('#a9b24b',12,-20,4,3);blob('#a9b24b',0,-15,10,14);
    g.fillStyle='#4a5a14';[[-8,-24],[8,-24],[-9,-12],[9,-12],[0,-29]].forEach(q=>g.fillRect(q[0]-1,q[1]-1,2,3));
    blob('#fff',-3,-20,3.4,4);blob('#fff',4,-20,3.4,4);g.fillStyle='#111';g.fillRect(-2,-20,2,3);g.fillRect(5,-20,2,3);
    g.strokeStyle='#111';g.lineWidth=1.6;g.beginPath();g.moveTo(-7,-26);g.lineTo(-1,-22);g.moveTo(9,-26);g.lineTo(3,-22);g.stroke();
    blob('#a01428',1,-10,5,3.6);g.fillStyle='#fff';g.fillRect(-2,-12,2,2);g.fillRect(1,-12,2,2);g.fillRect(4,-12,2,2);
  }else if(t==='t'){
    blob('#7a4a12',-9+wf,-1,4,2.5);blob('#7a4a12',9-wf,-1,4,2.5);poly('#7a4a12',[[-15,-4],[-21,-2],[-14,-7]]);
    blob('#8a5a1a',17,-6,5,4);blob('#fff',19,-7,1.6,1.6);blob('#8a4b14',0,-9,15,9);
    for(const x of[-9,-3,3,9])poly('#d64545',[[x-3,-15],[x,-23],[x+3,-15]]);
    g.strokeStyle='#4a2a08';g.lineWidth=1.2;g.beginPath();g.moveTo(-8,-10);g.lineTo(0,-14);g.lineTo(8,-10);g.stroke();
  }else if(t==='l'){
    g.strokeStyle='#222';g.lineWidth=1.5;g.beginPath();[-6,0,6].forEach(x=>{g.moveTo(x,-4);g.lineTo(x-2,0);});g.stroke();
    blob('#e8e8ee',-3,-15+fw*.4,9,3);blob('#c4121c',-1,-9,11,8);g.fillStyle='#111';[[-6,-11],[0,-13],[3,-8]].forEach(q=>{g.beginPath();g.arc(q[0],q[1],2.2,0,7);g.fill();});
    blob('#2a2a2a',11,-8,5,4);blob('#fff',12,-9,1.6,1.6);g.strokeStyle='#222';g.beginPath();g.moveTo(13,-12);g.lineTo(16,-16);g.stroke();
  }else if(t==='r'){
    box('#2d62c0',-13,-18,6,12);poly('#ffb02e',[[-12,-6],[-7,-6],[-9.5,0+fw*.4]]);
    blob('#4cc3ff',-4,-27,3,8);blob('#4cc3ff',2,-28,3,8);blob('#2ea8ff',0,-12,10,9);
    blob('#fff',4,-13,3,3.4);g.fillStyle='#111';g.fillRect(5,-14,2,3);blob('#fff',3,-8,4,2.4);
  }else{
    poly('#7e0d0d',[[-6,-26],[-30,-46+fw*2],[-26,-30],[-12,-14]]);poly('#c11414',[[-18,-14],[-36,-8],[-30,-3],[-12,-8]]);
    blob('#a80f0f',-8,-3,5,4);blob('#a80f0f',10,-3,5,4);blob('#c11414',0,-18,22,12);
    for(const x of[-12,-4,4])poly('#ff9d2e',[[x-3,-28],[x,-34],[x+3,-28]]);
    blob('#c11414',21,-26,11,9);poly('#ff9d2e',[[16,-33],[13,-45],[22,-34]]);poly('#ff9d2e',[[24,-34],[24,-46],[30,-33]]);
    blob('#fff',24,-28,3,3.4);g.fillStyle='#111';g.fillRect(25,-29,2,3);g.fillStyle='#fff';for(let k=0;k<4;k++)g.fillRect(24+k*3,-20,2,3);
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(-14,-54,28,4);g.fillStyle='#ff5252';g.fillRect(-14,-54,28*e.hp/5,4);
  }
  g.globalAlpha=1;g.restore();
}
// ── realistic platform art: the whole static level is painted once into an offscreen canvas ──
function sh(h,k){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')';}
const hs=(x,y,i)=>{const v=Math.sin(x*127.1+y*311.7+i*74.7)*43758.5453;return v-Math.floor(v);};
let LC=null;
function buildCache(n){
  LC=document.createElement('canvas');LC.width=LW*T;LC.height=H;const c=LC.getContext('2d'),th=LV[n];
  const sd=(x,y)=>x>=0&&x<LW&&y>=0&&y<LH&&G[y][x]==='#';
  for(let ty=0;ty<LH;ty++)for(let tx=0;tx<LW;tx++){const ch=G[ty][tx],x=tx*T,y=ty*T;
    if(ch==='#'){

  g.fillStyle='rgba(10,6,32,.78)';g.fillRect(20,H-104,W-40,92);g.strokeStyle='#8b5cf6';g.lineWidth=2;g.strokeRect(20,H-104,W-40,92);
  let c=Math.floor(ST.t*34);g.fillStyle='#fff';ls.forEach((l,i)=>{g.fillText(l.slice(0,Math.max(0,c)),36,H-78+i*24);c-=l.length+1;});
  if(!NET){g.fillStyle='rgba(255,255,255,.55)';g.font='11px sans-serif';g.textAlign='right';g.fillText('tap / Enter = next',W-30,H-18);}}
skipB.onclick=()=>endStory();
cv.addEventListener('pointerdown',()=>{if(state==='story'&&!NET)nextScene();});
function begin(n,st,intro){lives=5;stars=st;ov.style.display='none';if(intro)story('intro',()=>start(n));else start(n);}
function ui(h,p,btns){skipB.style.display='none';document.body.classList.remove('story');ov.innerHTML='<div><h2>'+h+'</h2><p>'+p+'</p></div>';const d=ov.firstChild;
  btns.forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;d.appendChild(b);});ov.style.display='flex';}
function menu(){state='menu';load(0);const S0=sv(),cont=S0.lvl>0||S0.stars>0;
  ui('🏰 Moon Castle Duo','Two heroes, one haunted castle. Collect stars, zap or stomp monsters and reach the door <b>together</b>.<br><br><b style="color:#ff6a5a">P1</b>: A / D move · W jump · F cast &nbsp;&nbsp; <b style="color:#d7f06a">P2</b>: ← → move · ↑ jump · Enter cast<br>Cactus and turtle are spiky: <b>shoot</b> them, don’t stomp! Dragons take 5 hits.<br>On touch screens use the on-screen pads (the diagonal ⬉ ⬈ buttons jump and move at the same time).<br>🌸 Jump on a flower to fly for a few seconds (hold jump to flap)!',
    (cont?[['▶ Continue · Level '+((S0.lvl|0)+1),()=>{NET=null;begin(S0.lvl|0,S0.stars|0);}]]:[]).concat([['New game · same screen',()=>{NET=null;begin(0,0,1);}]]).concat(PB?[['🌐 Online with a friend',()=>lobby()]]:[]));}
// ── online duo: needs the website (same origin) for the Supabase client + signed-in player ──
const PB=(()=>{try{const c=parent!==window&&parent.castleCtx&&parent.castleCtx();return c&&c.sb&&c.player?c:null;}catch(e){return null;}})();
const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function net(ev,p){try{NET&&NET.ch.send({type:'broadcast',event:ev,payload:p||{}});}catch(e){}}
function netClose(quick){const n=NET;if(!n)return;NET=null;clearInterval(n.iv);clearTimeout(n.to);
  try{n.ch.send({type:'broadcast',event:'leave',payload:{}});}catch(e){}
  const rm=()=>{try{PB.sb.removeChannel(n.ch);}catch(e){}};quick?rm():setTimeout(rm,300);}
function lobby(msg){NET&&netClose();NAMES[0]=NAMES[1]='';
  ui('🌐 Play online',(msg?'<b style="color:#ff8a8a">'+msg+'</b><br>':'')+'Create a room and send the code to your friend, or type the code you got.<br><input id="jc" maxlength="5" placeholder="CODE" style="margin-top:.6rem;padding:.5rem;border-radius:10px;border:1px solid #8b5cf6;background:#150f3d;color:#fff;text-align:center;font:700 1rem Poppins,sans-serif;width:7rem;text-transform:uppercase">',
   [['Create room',()=>{let c='';for(let i=0;i<5;i++)c+=AB[Math.floor(Math.random()*AB.length)];netConnect(c,'host');}],
    ['Join',()=>{const c=document.getElementById('jc').value.trim().toUpperCase();/^[A-Z0-9]{5}$/.test(c)?netConnect(c,'guest'):lobby('Enter the 5-letter code.');}],['Back',menu]]);}
function netLeft(){if(!NET||!NET.live)return;state='menu';ui('Friend left 😢','Your friend left the room.',[['Back',()=>{netClose();menu();}]]);}
function netConnect(code,role){
  const me=PB.player,ch=PB.sb.channel('castle-'+code,{config:{broadcast:{self:false},presence:{key:me.id}}});
  NET={ch,role,me:role==='host'?0:1,code,opp:null,live:0,began:0};NAMES[NET.me]=String(me.name||'Me').slice(0,10);
  const on=(e,f)=>ch.on('broadcast',{event:e},m=>f(m.payload||{}));
  on('join',m=>{if(role!=='host'||!m.id||!NET)return;if(NET.opp&&NET.opp.id!==m.id){net('full',{to:m.id});return;}
    NET.opp=m;NET.live=1;NAMES[1]=String(m.name||'Friend').slice(0,10);
    if(!NET.sp){const s0=sv(),fr=!(s0.lvl>0||s0.stars>0);NET.sp={name:me.name,l:s0.lvl|0,st:s0.stars|0,i:fr?1:0};net('start',NET.sp);begin(NET.sp.l,NET.sp.st,NET.sp.i);}else net('start',NET.sp);});
  on('start',m=>{if(role!=='guest'||!NET||NET.began)return;NET.began=NET.live=1;clearInterval(NET.iv);clearTimeout(NET.to);NAMES[0]=String(m.name||'Friend').slice(0,10);begin(m.l|0,m.st|0,m.i);});
  on('full',m=>{if(m.to===me.id){netClose();lobby('That room already has two players.');}});
  on('s',m=>{if(NET)P[1-NET.me].net=m;});
  on('bolt',m=>B.push({x:m.x,y:m.y,vx:m.vx,l:60,c:m.c,r:1}));
  on('hit',m=>{const e=E[m.i];if(e&&!e.dead)hit(e);});
  on('star',m=>{const s=S[m.i];if(s&&!s.g){s.g=1;stars++;if(stars%15===0)lives++;}});
  on('life',m=>{lives=m.l;if(lives<=0&&state==='play')over();});
  on('go',m=>{if(state==='story'||(!m.m&&m.n===lvl&&state==='play'))return;go(m.n,m.m,1);});
  on('leave',netLeft);
  ch.on('presence',{event:'leave'},netLeft);
  ch.subscribe(st=>{if(!NET||NET.ch!==ch)return;
    if(st==='SUBSCRIBED'){try{ch.track({id:me.id});}catch(e){}
      if(role==='guest'){const h=()=>net('join',{id:me.id,name:me.name});h();NET.iv=setInterval(h,2000);
        NET.to=setTimeout(()=>{if(NET&&!NET.began){netClose();lobby('Room not found. Ask your friend for a new code.');}},9000);}
      else ui('Room '+code,'Waiting for your friend…<br>Tell them to open <b>Moon Castle Duo</b> → <b>Play online</b> → <b>Join</b> and type this code.',[['Copy code',()=>{try{navigator.clipboard.writeText(code);}catch(e){}}],['Cancel',()=>lobby()]]);}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){netClose();lobby('Could not connect. Check your internet.');}});
  if(role==='guest')ui('Joining '+code+'…','Looking for the room…',[['Cancel',()=>lobby()]]);
}
addEventListener('pagehide',()=>netClose(1));
function start(n){lvl=n;sStart=stars;svSet({lvl:n,stars:sStart,seen:1});load(n);state='play';document.body.classList.toggle('online',!!NET);}
let last=0,acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=16.67){if(state==='play')step();else if(state==='story'&&ST)stTick();acc-=16.67;}if(state==='story'&&ST)drawStory();else draw();requestAnimationFrame(loop);}
load(0);
menu();
requestAnimationFrame(loop);
</script>
</body>
